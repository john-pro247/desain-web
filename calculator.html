<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Normal calculator</title>
<style>
  :root {
    box-sizing: border-box;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
    --bg: #eef1f5;
    --panel: #ffffff;
    --ink: #1c2430;
    --muted: #5d6877;
    --line: #c9d1dc;
    --op: #1f4e79;
    --op-ink: #ffffff;
    --reset: #b3412f;
    --result-bg: #f3f6fa;
    --error: #b3412f;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #12161c;
      --panel: #1c222b;
      --ink: #e8edf3;
      --muted: #9aa5b4;
      --line: #384352;
      --op: #6aa6dd;
      --op-ink: #0e1318;
      --reset: #e5806f;
      --result-bg: #141920;
      --error: #f0907f;
    }
  }
  :root[data-theme="dark"] {
    --bg: #12161c; --panel: #1c222b; --ink: #e8edf3; --muted: #9aa5b4;
    --line: #384352; --op: #6aa6dd; --op-ink: #0e1318; --reset: #e5806f;
    --result-bg: #141920; --error: #f0907f;
  }
  html { scroll-padding-top: env(safe-area-inset-top, 0px); }
  body {
    margin: 0;
    min-height: 100vh;
    display: grid;
    place-items: center;
    padding: 16px;
    background: var(--bg);
    color: var(--ink);
    font-family: "Trebuchet MS", "Segoe UI", system-ui, sans-serif;
  }
  .calc {
    width: 100%;
    max-width: 380px;
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 14px;
    padding: 24px;
  }
  h1 { font-size: 1.25rem; margin: 0 0 18px; }
  label { display: block; font-size: .9rem; color: var(--muted); margin-bottom: 6px; }
  input[type="number"] {
    width: 100%;
    box-sizing: border-box;
    font: inherit;
    font-size: 1.15rem;
    padding: 10px 12px;
    margin-bottom: 14px;
    color: var(--ink);
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 8px;
  }
  input:focus-visible, button:focus-visible { outline: 3px solid var(--op); outline-offset: 2px; }
  .ops { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin: 4px 0 10px; }
  button {
    font: inherit;
    font-size: 1.4rem;
    padding: 12px 0;
    cursor: pointer;
    border: 0;
    border-radius: 8px;
    background: var(--op);
    color: var(--op-ink);
  }
  button:active { transform: translateY(1px); }
  button.reset {
    width: 100%;
    font-size: 1rem;
    background: transparent;
    color: var(--reset);
    border: 1px solid var(--reset);
  }
  .hasil {
    margin: 18px 0 14px;
    padding: 14px;
    background: var(--result-bg);
    border-radius: 8px;
    min-height: 3.2em;
  }
  .hasil small { display: block; color: var(--muted); font-size: .85rem; min-height: 1.2em; }
  .hasil output { display: block; font-size: 1.8rem; font-weight: 700; word-break: break-all; }
  .hasil.error output { color: var(--error); font-size: 1.1rem; }
</style>
</head>
<body>
  <main class="calc">
    <h1>Normal calculator</h1>

    <label for="angka1">First number</label>
    <input type="number" id="angka1" placeholder="Example: 12" step="any">

    <label for="angka2">Second number</label>
    <input type="number" id="angka2" placeholder="Example: 4" step="any">

    <div class="ops">
      <button type="button" onclick="hitung('+')" aria-label="Tambah">+</button>
      <button type="button" onclick="hitung('-')" aria-label="Kurang">−</button>
      <button type="button" onclick="hitung('*')" aria-label="Kali">×</button>
      <button type="button" onclick="hitung('/')" aria-label="Bagi">÷</button>
    </div>

    <div class="hasil" id="kotakHasil" aria-live="polite">
      <small id="ekspresi"></small>
      <output id="hasil">0</output>
    </div>

    <button type="button" class="reset" onclick="reset()">Reset</button>
  </main>

  <script>
    function hitung(operator) {
      var a = document.getElementById("angka1").value;
      var b = document.getElementById("angka2").value;
      var kotak = document.getElementById("kotakHasil");
      var hasil = document.getElementById("hasil");
      var ekspresi = document.getElementById("ekspresi");

      kotak.classList.remove("error");

      if (a === "" || b === "") {
        tampilkanError("Enter the other number before running it ");
        return;
      }

      a = parseFloat(a);
      b = parseFloat(b);
      var simbol = { "+": "+", "-": "−", "*": "×", "/": "÷" };
      var nilai;

      switch (operator) {
        case "+": nilai = a + b; break;
        case "-": nilai = a - b; break;
        case "*": nilai = a * b; break;
        case "/":
          if (b === 0) {
            tampilkanError("Cannot devided by zero !!!.");
            return;
          }
          nilai = a / b;
          break;
      }
      nilai = parseFloat(nilai.toFixed(10));

      ekspresi.textContent = a + " " + simbol[operator] + " " + b + " =";
      hasil.textContent = nilai;
    }

    function tampilkanError(pesan) {
      document.getElementById("kotakHasil").classList.add("error");
      document.getElementById("ekspresi").textContent = "";
      document.getElementById("hasil").textContent = pesan;
    }

    function reset() {
      document.getElementById("angka1").value = "";
      document.getElementById("angka2").value = "";
      document.getElementById("ekspresi").textContent = "";
      document.getElementById("hasil").textContent = "0";
      document.getElementById("kotakHasil").classList.remove("error");
      document.getElementById("angka1").focus();
    }
  </script>
</body>
</html>
