<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login Admin – Kulineria</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="login-wrapper">
    <div class="card login-card">
      <div class="card-body text-center">
        <div class="login-icon">
          <i class="bi bi-shield-lock"></i>
        </div>
        <h3 class="fw-bold mb-1">Admin Login</h3>
        <p class="text-muted small mb-4">Masuk ke panel administrasi Kulineria</p>

        <form id="adminForm" onsubmit="return handleLogin(event)">
          <div class="mb-3 text-start">
            <label for="username" class="form-label fw-medium">Username</label>
            <div class="input-group">
              <span class="input-group-text"><i class="bi bi-person"></i></span>
              <input type="text" class="form-control" id="username" placeholder="admin" required>
            </div>
          </div>
          <div class="mb-4 text-start">
            <label for="password" class="form-label fw-medium">Password</label>
            <div class="input-group">
              <span class="input-group-text"><i class="bi bi-lock"></i></span>
              <input type="password" class="form-control" id="password" placeholder="••••••••" required>
            </div>
          </div>
          <button type="submit" class="btn btn-danger w-100 py-2 fw-semibold mb-3">
            <i class="bi bi-box-arrow-in-right me-2"></i>Masuk
          </button>
        </form>

        <a href="index.html" class="text-muted small text-decoration-none">
          <i class="bi bi-arrow-left me-1"></i> Kembali ke Beranda
        </a>

        <div id="loginAlert" class="alert alert-danger mt-3 d-none" role="alert">
          Username atau password salah.
        </div>
        <div id="loginSuccess" class="alert alert-success mt-3 d-none" role="alert">
          Login berhasil! Mengalihkan ke dashboard...
        </div>
      </div>
    </div>
  </div>

  <script>
    // Simple demo login (static only)
    // Username: admin | Password: admin123
    function handleLogin(e) {
      e.preventDefault();
      const user = document.getElementById('username').value.trim();
      const pass = document.getElementById('password').value;

      const alertBox = document.getElementById('loginAlert');
      const successBox = document.getElementById('loginSuccess');

      if (user === 'admin' && pass === 'admin123') {
        alertBox.classList.add('d-none');
        successBox.classList.remove('d-none');
        setTimeout(() => {
          window.location.href = 'admin-dashboard.html';
        }, 1200);
      } else {
        successBox.classList.add('d-none');
        alertBox.classList.remove('d-none');
      }
      return false;
    }
  </script>
</body>
</html>
